version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kellun-postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-kellun_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kellun_password}
      POSTGRES_DB: ${DB_NAME:-kellun_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
